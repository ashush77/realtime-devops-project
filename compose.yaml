services:
  backend:
    build: .
    container_name: realtime-devops-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_HOST: postgres
      DB_NAME: devopsdb
      DB_USER: devopsuser
      DB_PASSWORD: "${DB_PASSWORD:-devops-dev-only}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: realtime-devops-postgres
    environment:
      POSTGRES_DB: devopsdb
      POSTGRES_USER: devopsuser
      POSTGRES_PASSWORD: "${DB_PASSWORD:-devops-dev-only}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devopsuser -d devopsdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  
  nginx:
    image: nginx:alpine
    container_name: realtime-devops-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:


name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: devopsdb
          POSTGRES_USER: devopsuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devopsuser -d devopsdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_NAME: devopsdb
      DB_USER: devopsuser
      DB_PASSWORD: testpassword

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

  publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ashushrm77/realtime-devops-project:latest
            ashushrm77/realtime-devops-project:${{ github.sha }}

  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: GitHubActionsDeploy

      - name: Send deployment command to EC2
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy realtime-devops-project ${IMAGE_TAG}" \
            --parameters "commands=[
              \"set -eu\",
              \"cd /home/ubuntu/realtime-devops-project\",
              \"export IMAGE_TAG=${IMAGE_TAG}\",
              \"docker compose pull backend\",
              \"docker compose up -d --no-deps backend\",
              \"for attempt in \\$(seq 1 12); do if curl --fail --silent --show-error http://127.0.0.1:8000/; then echo Backend-health-check-passed; exit 0; fi; echo Backend-not-ready-yet-attempt-\\$attempt-of-12; sleep 5; done; echo Backend-health-check-failed-after-retries; docker compose logs --tail 100 backend; exit 1\"
              ]"
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for deployment. Check SSM Run Command in AWS."
          exit 1
